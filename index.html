<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paheli — A Story to Unfold</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0A0602;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Cinzel', serif;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Brand overlay */
  .brand {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .brand-icon {
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1.2s ease 0.6s forwards;
  }

  .brand-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(42px, 7vw, 80px);
    font-weight: 500;
    letter-spacing: clamp(12px, 2.5vw, 24px);
    color: #E8D5B0;
    text-transform: uppercase;
    text-indent: clamp(12px, 2.5vw, 24px);
    opacity: 0;
    animation: fadeUp 1.2s ease 0.9s forwards;
    line-height: 1;
    margin-bottom: 8px;
  }

  .ornament {
    display: flex;
    align-items: center;
    gap: 0;
    width: clamp(180px, 30vw, 300px);
    margin: 20px 0 16px;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.1s forwards;
  }

  .orn-line {
    flex: 1;
    height: 0.5px;
    background: linear-gradient(90deg, transparent, #8B5E2A);
  }
  .orn-line.right {
    background: linear-gradient(90deg, #8B5E2A, transparent);
  }
  .orn-diamond {
    width: 4px; height: 4px;
    background: #C4881A;
    transform: rotate(45deg);
    margin: 0 10px;
    flex-shrink: 0;
  }
  .orn-dot {
    width: 2px; height: 2px;
    background: #8B5E2A;
    transform: rotate(45deg);
    margin: 0 6px;
    flex-shrink: 0;
  }

  .descriptor {
    font-family: 'Cinzel', serif;
    font-size: clamp(7px, 1vw, 10px);
    font-weight: 400;
    letter-spacing: clamp(3px, 1vw, 6px);
    color: #6B4820;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.2s forwards;
    margin-bottom: 16px;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px, 2vw, 20px);
    font-weight: 300;
    font-style: italic;
    color: #A07840;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.4s forwards;
    margin-bottom: 48px;
  }

  .coming-soon {
    font-family: 'Cinzel', serif;
    font-size: clamp(8px, 1vw, 10px);
    font-weight: 400;
    letter-spacing: clamp(4px, 1.2vw, 8px);
    color: #4A3218;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.6s forwards;
    text-indent: clamp(4px, 1.2vw, 8px);
  }

  /* Controls */
  .controls {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    z-index: 20;
    pointer-events: all;
    opacity: 0;
    animation: fadeUp 1s ease 2s forwards;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #7A5828;
    border: 0.5px solid #3A2810;
    background: rgba(10,6,2,0.6);
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }

  .btn:hover {
    color: #C4881A;
    border-color: #6B4820;
    background: rgba(20,12,4,0.8);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div class="brand">
  <div class="brand-icon">
    <svg width="56" height="56" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#C4881A"/>
          <stop offset="100%" style="stop-color:#7A5020"/>
        </linearGradient>
      </defs>
      <rect x="8" y="8" width="36" height="36" rx="2.5" fill="none" stroke="url(#g)" stroke-width="1.2"/>
      <path d="M21 8 Q21 1 26 1 Q31 1 31 8" fill="none" stroke="url(#g)" stroke-width="1.2"/>
      <path d="M44 19 Q51 19 51 24 Q51 29 44 29" fill="none" stroke="url(#g)" stroke-width="1.2"/>
      <path d="M21 44 Q21 51 26 51 Q31 51 31 44" fill="none" stroke="url(#g)" stroke-width="1.2"/>
      <path d="M8 19 Q1 19 1 24 Q1 29 8 29" fill="none" stroke="url(#g)" stroke-width="1.2"/>
    </svg>
  </div>

  <div class="brand-name">Paheli</div>

  <div class="ornament">
    <div class="orn-line"></div>
    <div class="orn-dot"></div>
    <div class="orn-diamond"></div>
    <div class="orn-dot"></div>
    <div class="orn-line right"></div>
  </div>

  <div class="descriptor">Artisan Wooden Puzzle</div>
  <div class="tagline">a story to unfold</div>
  <div class="coming-soon">Coming Soon</div>
</div>

<div class="controls">
  <button class="btn" onclick="scatter()">Scatter</button>
  <button class="btn" onclick="assemble()">Assemble</button>
  <button class="btn" onclick="shuffleColors()">Retheme</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, pieces = [], animFrame, theme = 0;

const themes = [
  { bg: '#0A0602', stroke: '#C4881A', fill: 'rgba(30,16,4,0.85)', glow: 'rgba(196,136,26,0.08)' },
  { bg: '#030A05', stroke: '#4A9A6A', fill: 'rgba(4,22,10,0.85)', glow: 'rgba(74,154,106,0.08)' },
  { bg: '#05060A', stroke: '#6A7AC4', fill: 'rgba(8,10,28,0.85)', glow: 'rgba(106,122,196,0.08)' },
  { bg: '#0A0604', stroke: '#C4781A', fill: 'rgba(28,14,4,0.85)', glow: 'rgba(196,120,26,0.08)' },
];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

// Draw a single puzzle piece path given center (cx,cy), size, and which sides have tabs
function piecePath(cx, cy, sz, tabs) {
  // tabs: { top, right, bottom, left } — true = tab out, false = socket in, null = flat
  const h = sz / 2;
  const t = sz * 0.28;  // tab reach
  const tw = sz * 0.22; // tab width
  const c1 = sz * 0.1;

  ctx.beginPath();

  // TOP edge
  ctx.moveTo(cx - h, cy - h);
  if (tabs.top === null) {
    ctx.lineTo(cx + h, cy - h);
  } else {
    const dir = tabs.top ? -1 : 1;
    ctx.lineTo(cx - tw, cy - h);
    ctx.bezierCurveTo(cx - tw, cy - h - c1 * dir, cx - tw * 0.5, cy - h - t * dir, cx, cy - h - t * dir);
    ctx.bezierCurveTo(cx + tw * 0.5, cy - h - t * dir, cx + tw, cy - h - c1 * dir, cx + tw, cy - h);
    ctx.lineTo(cx + h, cy - h);
  }

  // RIGHT edge
  if (tabs.right === null) {
    ctx.lineTo(cx + h, cy + h);
  } else {
    const dir = tabs.right ? -1 : 1;
    ctx.lineTo(cx + h, cy - tw);
    ctx.bezierCurveTo(cx + h + c1 * dir, cy - tw, cx + h + t * dir, cy - tw * 0.5, cx + h + t * dir, cy);
    ctx.bezierCurveTo(cx + h + t * dir, cy + tw * 0.5, cx + h + c1 * dir, cy + tw, cx + h, cy + tw);
    ctx.lineTo(cx + h, cy + h);
  }

  // BOTTOM edge (right to left)
  if (tabs.bottom === null) {
    ctx.lineTo(cx - h, cy + h);
  } else {
    const dir = tabs.bottom ? -1 : 1;
    ctx.lineTo(cx + tw, cy + h);
    ctx.bezierCurveTo(cx + tw, cy + h + c1 * dir, cx + tw * 0.5, cy + h + t * dir, cx, cy + h + t * dir);
    ctx.bezierCurveTo(cx - tw * 0.5, cy + h + t * dir, cx - tw, cy + h + c1 * dir, cx - tw, cy + h);
    ctx.lineTo(cx - h, cy + h);
  }

  // LEFT edge (bottom to top)
  if (tabs.left === null) {
    ctx.lineTo(cx - h, cy - h);
  } else {
    const dir = tabs.left ? -1 : 1;
    ctx.lineTo(cx - h, cy + tw);
    ctx.bezierCurveTo(cx - h - c1 * dir, cy + tw, cx - h - t * dir, cy + tw * 0.5, cx - h - t * dir, cy);
    ctx.bezierCurveTo(cx - h - t * dir, cy - tw * 0.5, cx - h - c1 * dir, cy - tw, cx - h, cy - tw);
    ctx.lineTo(cx - h, cy - h);
  }

  ctx.closePath();
}

function initPieces() {
  pieces = [];
  const cols = 7, rows = 5;
  const sz = Math.min(W / (cols + 2), H / (rows + 2));
  const gW = cols * sz, gH = rows * sz;
  const offX = (W - gW) / 2, offY = (H - gH) / 2;

  // Build edge registry — shared edges must be opposites
  const hEdges = {}; // horizontal shared edges [row][col] between row and row+1
  const vEdges = {}; // vertical shared edges [row][col] between col and col+1

  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols; c++) {
      hEdges[`${r}-${c}`] = Math.random() > 0.5;
    }
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols - 1; c++) {
      vEdges[`${r}-${c}`] = Math.random() > 0.5;
    }
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const tx = offX + c * sz + sz / 2;
      const ty = offY + r * sz + sz / 2;

      const tabs = {
        top:    r === 0        ? null : hEdges[`${r-1}-${c}`],
        bottom: r === rows - 1 ? null : !hEdges[`${r}-${c}`],
        left:   c === 0        ? null : vEdges[`${r}-${c-1}`],
        right:  c === cols - 1 ? null : !vEdges[`${r}-${c}`],
      };

      // Random scattered position
      const sx = Math.random() * W;
      const sy = Math.random() * H;
      const angle = (Math.random() - 0.5) * Math.PI * 2;
      const opacity = 0.3 + Math.random() * 0.5;
      const speed = 0.0002 + Math.random() * 0.0004;
      const phase = Math.random() * Math.PI * 2;
      const drift = { x: (Math.random() - 0.5) * 0.3, y: (Math.random() - 0.5) * 0.3 };

      pieces.push({
        // target (assembled)
        tx, ty, ta: 0,
        // current
        x: sx, y: sy, a: angle,
        // scatter target
        sx, sy, sa: angle,
        opacity, speed, phase, drift, sz,
        tabs,
        // animation
        lerping: false, lerpT: 0, lerpFrom: null, lerpTo: null
      });
    }
  }
}

function scatter() {
  pieces.forEach(p => {
    p.lerpFrom = { x: p.x, y: p.y, a: p.a };
    p.sx = 60 + Math.random() * (W - 120);
    p.sy = 60 + Math.random() * (H - 120);
    p.sa = (Math.random() - 0.5) * Math.PI * 2;
    p.lerpTo = { x: p.sx, y: p.sy, a: p.sa };
    p.lerping = true;
    p.lerpT = 0;
    p.lerpDur = 0.8 + Math.random() * 0.6;
    p.lerpStart = performance.now();
  });
}

function assemble() {
  pieces.forEach(p => {
    p.lerpFrom = { x: p.x, y: p.y, a: p.a };
    p.lerpTo = { x: p.tx, y: p.ty, a: p.ta };
    p.lerping = true;
    p.lerpT = 0;
    p.lerpDur = 1.0 + Math.random() * 0.8;
    p.lerpStart = performance.now();
  });
}

function shuffleColors() {
  theme = (theme + 1) % themes.length;
  document.body.style.background = themes[theme].bg;
}

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
}

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

let lastTime = 0;

function draw(now) {
  animFrame = requestAnimationFrame(draw);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const T = themes[theme];

  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = T.bg;
  ctx.fillRect(0, 0, W, H);

  // Vignette
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.1, W/2, H/2, H*0.85);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  pieces.forEach(p => {
    // Handle lerp animation
    if (p.lerping) {
      const elapsed = (now - p.lerpStart) / 1000;
      const t = Math.min(elapsed / p.lerpDur, 1);
      const et = easeInOut(t);
      p.x = lerp(p.lerpFrom.x, p.lerpTo.x, et);
      p.y = lerp(p.lerpFrom.y, p.lerpTo.y, et);
      p.a = lerpAngle(p.lerpFrom.a, p.lerpTo.a, et);
      if (t >= 1) {
        p.lerping = false;
        p.x = p.lerpTo.x;
        p.y = p.lerpTo.y;
        p.a = p.lerpTo.a;
        p.sx = p.x; p.sy = p.y; p.sa = p.a;
      }
    } else {
      // Gentle float
      p.x += Math.sin(now * p.speed + p.phase) * p.drift.x;
      p.y += Math.cos(now * p.speed * 0.7 + p.phase) * p.drift.y;
      p.a += Math.sin(now * p.speed * 0.5) * 0.0002;
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.a);

    // Glow
    ctx.shadowColor = T.stroke;
    ctx.shadowBlur = 8;

    piecePath(0, 0, p.sz, p.tabs);

    // Fill
    ctx.fillStyle = T.fill;
    ctx.fill();

    // Stroke
    ctx.shadowBlur = 0;
    ctx.strokeStyle = T.stroke;
    ctx.lineWidth = 0.8;
    ctx.globalAlpha = p.opacity;
    ctx.stroke();

    // Inner highlight
    ctx.globalAlpha = p.opacity * 0.15;
    ctx.strokeStyle = '#FFF';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.restore();
  });
}

// Init
resize();
initPieces();
requestAnimationFrame(draw);
window.addEventListener('resize', () => { resize(); initPieces(); });

// Click to scatter/assemble toggle
let assembled = false;
canvas.addEventListener('click', () => {
  assembled = !assembled;
  assembled ? assemble() : scatter();
});
</script>
</body>
</html>
